# OpenAPI 3.0 契约样例 —— 订单资源
#
# 用途：新接口设计的起步模板，演示本仓库 API 规范在 OpenAPI 上的完整落地。
# 对照规范：rules/api/api-naming.md（URL/方法/命名矩阵）、
#          rules/api/api-request-response.md（envelope/分页/脱敏）、
#          rules/api/status-codes.md（错误码）。
# 新接口照抄本文件的结构与命名，替换业务字段即可。

openapi: 3.0.3
info:
  title: RD-Standards 示例服务
  version: 1.0.0
  description: |
    演示规范落地的样例契约：
    - URL：小写连字符 + 复数名词 + 版本入路径；非 CRUD 动作用动词子路径
    - 字段：lowerCamelCase；ID 为字符串（防 JS 精度丢失）；时间 RFC 3339 带时区
    - 金额：整数（分）；枚举：全大写下划线；布尔：is/has 前缀（isDeleted）
    - 响应：统一 envelope {code, message, data, requestId, serverTime}
    - 错误：HTTP 码 + 业务码（"0" 成功 / A 用户端 / B 系统端 / C 三方）

servers:
  - url: https://api.example.com
    description: 预发
  - url: https://api.example.com
    description: 生产

security:
  - bearerAuth: []

paths:
  /api/v1/orders:
    get:
      summary: 订单列表（分页 + 过滤 + 排序）
      tags: [order]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }  # 上限强制（防全量拉取）
        - name: orderStatus
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: createdAfter
          in: query
          description: RFC 3339 时间，含时区
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          description: 排序字段，- 前缀表示倒序；实现侧必须做字段白名单校验
          schema: { type: string, default: '-createdAt' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListEnvelope' }
              example:
                code: '0'
                message: success
                data:
                  total: 137
                  page: 2
                  pageSize: 20
                  list:
                    - orderId: '10001'
                      orderStatus: PAID
                      amountCents: 9900
                      userId: 'u_8812'
                      isDeleted: false
                      createdAt: '2026-10-05T12:30:00+08:00'
                requestId: c0a80121-1730-4b1c-0001-6f96b2c4e2a0
                serverTime: '2026-10-05T12:31:00+08:00'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

    post:
      summary: 创建订单（幂等）
      tags: [order]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 写操作幂等键，重复提交返回首次结果
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '200':
          description: 创建成功（团队约定统一返回 200 + envelope；也可采用 201，仓库内保持一致）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '400': { $ref: '#/components/responses/InvalidParam' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      summary: 订单详情（敏感字段脱敏）
      tags: [order]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: 部分更新（只传变更字段，禁止大而全更新）
      tags: [order]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderPatchRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
    delete:
      summary: 删除订单（团队默认逻辑删除 isDeleted=1）
      tags: [order]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders/{orderId}/cancel:
    post:
      summary: 取消订单（非 CRUD 动作：动词子路径）
      tags: [order]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 200, description: 取消原因 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '409':
          description: 状态冲突（如已支付订单不可取消）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                code: A0500
                message: 当前订单状态不可取消
                data: null
                requestId: c0a80121-1730-4b1c-0001-6f96b2c4e2a0
                serverTime: '2026-10-05T12:31:00+08:00'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }
      description: 路径参数定位唯一资源，命名为 {xxx_id}

  responses:
    InvalidParam:
      description: 参数校验失败（A0100，details 含字段级错误）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            code: A0100
            message: 参数校验失败
            data:
              details:
                - { field: pageSize, reason: 必须为 1~100 的整数 }
            requestId: c0a80121-1730-4b1c-0001-6f96b2c4e2a0
            serverTime: '2026-10-05T12:31:00+08:00'
    Unauthorized:
      description: 未登录/token 失效（A0200/A0201）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { code: A0201, message: 登录已过期，请重新登录, data: null, requestId: r-1, serverTime: '2026-10-05T12:31:00+08:00' }
    Forbidden:
      description: 无权限（A0301，含水平越权拦截）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { code: A0301, message: 无权操作该资源, data: null, requestId: r-1, serverTime: '2026-10-05T12:31:00+08:00' }
    NotFound:
      description: 资源不存在（A0400）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { code: A0400, message: 资源不存在, data: null, requestId: r-1, serverTime: '2026-10-05T12:31:00+08:00' }
    Conflict:
      description: 重复创建等资源冲突（A0500）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { code: A0500, message: 记录已存在, data: null, requestId: r-1, serverTime: '2026-10-05T12:31:00+08:00' }
    VersionConflict:
      description: 乐观锁版本冲突（A0501）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { code: A0501, message: 数据已被修改，请刷新后重试, data: null, requestId: r-1, serverTime: '2026-10-05T12:31:00+08:00' }
    RateLimited:
      description: 触发限流（A0700）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { code: A0700, message: 请求过于频繁，请稍后再试, data: null, requestId: r-1, serverTime: '2026-10-05T12:31:00+08:00' }
    InternalError:
      description: 服务内部错误（B0001，不泄露内部细节）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { code: B0001, message: 服务开小差了，请稍后再试, data: null, requestId: r-1, serverTime: '2026-10-05T12:31:00+08:00' }

  schemas:
    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, PAID, SHIPPED, COMPLETED, CANCELLED, PENDING_REVIEW]
      description: 枚举传输值：全大写下划线

    Order:
      type: object
      properties:
        orderId:
          type: string
          description: 对外统一字符串（防 JS long 精度丢失）
        orderNo: { type: string, description: 业务单号 }
        orderStatus: { $ref: '#/components/schemas/OrderStatus' }
        amountCents:
          type: integer
          description: 金额，单位分（整数，避免浮点误差）
        userId: { type: string }
        userPhone:
          type: string
          example: '158****9119'
          description: 出参脱敏（安全规约），入参不接受该字段
        isDeleted: { type: boolean, description: 逻辑删除标记 }
        createdAt: { type: string, format: date-time, example: '2026-10-05T12:30:00+08:00' }
        updatedAt: { type: string, format: date-time, example: '2026-10-05T12:30:00+08:00' }

    OrderCreateRequest:
      type: object
      required: [skuId, quantity, addressId]
      properties:
        skuId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        addressId: { type: string }
        remark: { type: string, maxLength: 200 }

    OrderPatchRequest:
      type: object
      description: 只传变更字段（PATCH 语义，对应 ORM 禁止大而全更新）
      properties:
        remark: { type: string, maxLength: 200 }
        addressId: { type: string }

    # ---------- envelope 复用结构 ----------
    OrderEnvelope:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: '0' }
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/Order' }
        requestId: { type: string }
        serverTime: { type: string, format: date-time }

    OrderListEnvelope:
      type: object
      properties:
        code: { type: string, example: '0' }
        message: { type: string }
        data:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }
            list:
              type: array
              items: { $ref: '#/components/schemas/Order' }
        requestId: { type: string }
        serverTime: { type: string, format: date-time }

    EmptyEnvelope:
      type: object
      properties:
        code: { type: string, example: '0' }
        message: { type: string }
        data: { type: object, nullable: true }
        requestId: { type: string }
        serverTime: { type: string, format: date-time }

    ErrorEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: '"0" 成功；A 用户端 / B 系统端 / C 三方 + 4 位数字'
          example: A0100
        message:
          type: string
          description: 面向用户可读；禁止堆栈/表名/SQL 等内部细节
        data:
          type: object
          nullable: true
          description: 失败时为 null；A0100 时为 {details:[{field,reason}]}
        requestId: { type: string }
        serverTime: { type: string, format: date-time }
